name = "oblivion-cms"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# 注意：请勿在 wrangler.toml 中重复定义已在 Cloudflare Pages 控制台设置的环境变量，
# 否则 Cloudflare Pages Functions 发布时会报错："Binding name '...' already in use"。
# 所有环境变量请在 Cloudflare Dashboard -> Pages -> Settings -> Environment variables 中配置。

# Cloudflare D1 数据库绑定配置说明：
# 推荐方式：在 Cloudflare Dashboard -> Pages -> oblivion-cms -> Settings -> Functions -> D1 database bindings
# 点击 Add binding，变量名 (Variable name) 设置为 "DB"，选择你的 D1 数据库即可。
# （若使用 CLI 部署，可取消下方注释填入你的 database_id）
# [[d1_databases]]
# binding = "DB"
# database_name = "oblivion-db"
# database_id = "your-database-id"
